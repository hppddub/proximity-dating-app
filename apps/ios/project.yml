name: ProximityLab
options:
  bundleIdPrefix: ca.proximity
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
targets:
  ProximityLab:
    type: application
    platform: iOS
    sources: [ProximityLab]
    info:
      path: ProximityLab/Info.plist
      properties:
        CFBundleDisplayName: Proximity Lab
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: Detect enrolled test phones nearby during a voluntary experiment.
        NSCameraUsageDescription: Scan the current introduction's connection QR.
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.proximity.lab
        INFOPLIST_FILE: ProximityLab/Info.plist
schemes:
  ProximityLab:
    build:
      targets:
        ProximityLab: all

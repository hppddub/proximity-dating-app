name: Prototype checks
on:
  push:
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coordinator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew assembleDebug lintDebug testDebugUnitTest
        working-directory: apps/android
      - uses: actions/upload-artifact@v4
        with:
          name: proximity-lab-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check Mac phone-test certificate setup without installing trust
        run: npm run phone:mac -- --smoke
      - name: Check native protocol interoperability
        run: swiftc apps/ios/ProximityLab/EncounterProtocol.swift tools/verify-swift/main.swift -o /tmp/proximity-protocol && /tmp/proximity-protocol
      - name: Build iOS simulator app without signing
        run: xcodebuild -project apps/ios/ProximityLab.xcodeproj -scheme ProximityLab -sdk iphonesimulator -configuration Debug -derivedDataPath /tmp/proximity-derived CODE_SIGNING_ALLOWED=NO build
